name: Engineering task
description: A small deliverable with an owner and completion evidence.
title: "[Task] "
body:
  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      options:
        - System integration
        - Power PCB
        - Mechanical / payload
        - Jetson / perception
        - Package labels
        - Energy model
        - Documentation / tooling
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner and collaborators
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Deliverable
      description: What concrete problem does this change solve?
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies or blockers
  - type: textarea
    id: evidence
    attributes:
      label: Done when
      description: Name the artifact, measurement or test that closes this issue.
    validations:
      required: true
